name: Release

# Publica os pacotes quando uma tag no formato vX.Y.Z é enviada. Cada pacote é
# versionado de forma independente: a tag publica somente os pacotes cuja
# versão no manifesto coincide exatamente com a versão da tag, e todos os jobs
# de publicação dependem dos testes de todo o repositório.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify-node:
    name: verify (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - opencode
          - pi
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  verify-python:
    name: verify (datasette-llm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -e './datasette-llm[dev]'
      - run: .venv/bin/python -m pytest datasette-llm/tests -p no:cacheprovider

  publish-npm:
    name: publish npm (${{ matrix.package }})
    needs:
      - verify-node
      - verify-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - opencode
          - pi
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # A versão do pacote deve coincidir com a tag; caso contrário o job
      # apenas informa e não publica, permitindo releases por pacote.
      - name: Conferir versão da tag
        id: version
        run: |
          actual="$(node -p 'require("./package.json").version')"
          if [ "${RELEASE_TAG#v}" != "$actual" ]; then
            echo "Tag $RELEASE_TAG não corresponde à versão $actual de ${{ matrix.package }}/package.json; nada será publicado." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - run: echo "npm publish (${{ matrix.package }}@$(node -p 'require("./package.json").version'))" >> "$GITHUB_STEP_SUMMARY"
        if: steps.version.outputs.publish == 'true'
      - run: npm publish --access public
        if: steps.version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-registry:
    name: publish npm (opencode registry)
    needs:
      - verify-node
      - verify-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: opencode/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Conferir versão da tag
        id: version
        run: |
          actual="$(node -p 'require("./package.json").version')"
          if [ "${RELEASE_TAG#v}" != "$actual" ]; then
            echo "Tag $RELEASE_TAG não corresponde à versão $actual de opencode/package.json; nada será publicado." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # O OpenCode instala plugins pelo próprio registry, que é um espelho à
      # parte do npmjs. Esta publicação é opcional: só roda quando a variável
      # OPENCODE_REGISTRY_URL e o segredo OPENCODE_REGISTRY_TOKEN existem.
      - name: Publicar no registry do OpenCode
        if: steps.version.outputs.publish == 'true' && vars.OPENCODE_REGISTRY_URL != '' && secrets.OPENCODE_REGISTRY_TOKEN != ''
        run: npm publish --registry "$OPENCODE_REGISTRY_URL" --access public
        env:
          OPENCODE_REGISTRY_URL: ${{ vars.OPENCODE_REGISTRY_URL }}
          NODE_AUTH_TOKEN: ${{ secrets.OPENCODE_REGISTRY_TOKEN }}

  publish-pypi:
    name: publish PyPI (llm-llm-gateway)
    needs:
      - verify-node
      - verify-python
    runs-on: ubuntu-latest
    permissions:
      # Autenticação por trusted publishing (OIDC), sem tokens estáticos.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Conferir versão da tag
        id: version
        run: |
          actual="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("datasette-llm/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${RELEASE_TAG#v}" != "$actual" ]; then
            echo "Tag $RELEASE_TAG não corresponde à versão $actual de datasette-llm/pyproject.toml; nada será publicado." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - run: uv build ./datasette-llm --out-dir dist
        if: steps.version.outputs.publish == 'true'
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.version.outputs.publish == 'true'
        with:
          packages-dir: dist/
