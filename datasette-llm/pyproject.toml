[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-exp-gateway"
version = "0.1.0"
description = "Modelos de um gateway LiteLLM compatível com OpenAI para o CLI llm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "llm>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.entry-points.llm]
exp_gateway = "llm_exp_gateway"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
